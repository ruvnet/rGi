[workspace]
members = ["crates/rgi-core", "crates/rgi-wasm", "crates/rgi-napi"]
default-members = ["crates/rgi-core"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false
repository = "https://github.com/ruvnet/rGi"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rgi-core = { path = "crates/rgi-core" }

[profile.release]
lto = true
codegen-units = 1
strip = true
